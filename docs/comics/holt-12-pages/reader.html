<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>HOLT — Le S de solidarité</title>
  <style>
    :root { color-scheme: dark; --bg:#0c1119; --surface:#171f2a; --line:#344554; --ink:#f3f0e9; --soft:#9aafbd; --cyan:#8ddfec; --pink:#d9a1b8; }
    * { box-sizing:border-box; }
    body { margin:0; background:radial-gradient(ellipse at 50% 5%,#233747 0%,var(--bg) 55%); color:var(--ink); font:16px/1.45 "Segoe UI",Arial,sans-serif; min-height:100vh; }
    button,a { font:inherit; }
    a { color:var(--cyan); }
    button { cursor:pointer; }
    button:focus-visible,a:focus-visible { outline:2px solid var(--cyan); outline-offset:4px; }
    .shell { width:min(100%,1180px); margin:auto; padding:22px clamp(16px,3vw,38px) 38px; }
    header { display:flex; gap:18px; align-items:end; justify-content:space-between; border-bottom:1px solid var(--line); padding-bottom:17px; }
    .eyebrow { color:var(--cyan); font-size:.74rem; font-weight:700; letter-spacing:.2em; text-transform:uppercase; }
    h1 { font-size:clamp(1.35rem,3vw,2rem); letter-spacing:.025em; line-height:1.15; margin:6px 0 0; }
    .downloads { display:flex; gap:9px; flex-wrap:wrap; justify-content:end; }
    .downloads a { border:1px solid var(--line); background:var(--surface); border-radius:6px; padding:7px 11px; text-decoration:none; font-size:.86rem; }
    .downloads a:hover { border-color:var(--cyan); }
    .reader { display:grid; grid-template-columns:minmax(0,1fr) 190px; gap:23px; align-items:start; padding-top:20px; }
    .stage { min-width:0; }
    .toolbar { display:flex; justify-content:space-between; align-items:center; gap:15px; margin-bottom:12px; }
    .page-title { color:var(--soft); font-size:.92rem; }
    .page-title strong { display:block; color:var(--ink); font-size:1.1rem; }
    .controls { display:flex; align-items:center; gap:8px; }
    .controls button { border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:6px; min-width:42px; height:38px; }
    .controls button:hover:not(:disabled) { border-color:var(--cyan); color:var(--cyan); }
    .controls button:disabled { opacity:.38; cursor:default; }
    .counter { color:var(--soft); font-variant-numeric:tabular-nums; min-width:57px; text-align:center; }
    .page-frame { display:flex; justify-content:center; background:#090d13; border:1px solid var(--line); box-shadow:0 18px 60px #0007; padding:clamp(5px,1.5vw,14px); }
    #page { display:block; width:min(100%,680px); height:auto; aspect-ratio:2/3; object-fit:contain; background:#10141c; }
    .hint { color:var(--soft); font-size:.78rem; margin:13px 0 0; text-align:center; }
    aside { position:sticky; top:20px; background:#111923d9; border:1px solid var(--line); border-radius:8px; padding:14px; }
    aside h2 { color:var(--soft); text-transform:uppercase; font-size:.7rem; letter-spacing:.16em; margin:0 0 12px; }
    .chapters { display:grid; gap:4px; }
    .chapters button { width:100%; display:flex; gap:9px; align-items:center; text-align:left; border:1px solid transparent; border-radius:5px; background:transparent; color:var(--soft); padding:7px 8px; font-size:.82rem; line-height:1.2; }
    .chapters button span { color:var(--pink); font-size:.72rem; font-weight:700; font-variant-numeric:tabular-nums; }
    .chapters button:hover { color:var(--ink); background:#253544; }
    .chapters button[aria-current="page"] { color:var(--ink); border-color:#457389; background:#203442; }
    @media(max-width:760px) { header { align-items:start; } .reader { grid-template-columns:1fr; } aside { position:static; } .chapters { grid-template-columns:repeat(3,minmax(0,1fr)); } }
    @media(max-width:440px) { header { display:block; } .downloads { justify-content:start; margin-top:15px; } .chapters { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div><div class="eyebrow">Une histoire de HOLT · 12 pages de récit</div><h1>Le S de solidarité</h1></div>
      <div class="downloads"><a href="holt-le-s-de-solidarite.pdf" download>Ouvrir le PDF ↗</a></div>
    </header>
    <main class="reader">
      <section class="stage" aria-label="Page du comics">
        <div class="toolbar">
          <div class="page-title"><strong id="chapter">Couverture</strong><span id="description">Page 1 sur 14</span></div>
          <div class="controls"><button id="previous" type="button" aria-label="Page précédente">←</button><span class="counter" id="counter">01 / 14</span><button id="next" type="button" aria-label="Page suivante">→</button></div>
        </div>
        <div class="page-frame"><img id="page" src="pages/cover.png" alt="Couverture du comics HOLT" width="1600" height="2400"></div>
        <p class="hint">Utilisez les flèches ← → du clavier pour tourner les pages.</p>
      </section>
      <aside aria-label="Sommaire"><h2>Les douze pages</h2><nav class="chapters" id="chapters"></nav></aside>
    </main>
  </div>
  <script>
    const titles = ["Couverture", "Les choix", "L'exercice", "Six sur la photo", "La rupture", "La seule sortie", "Ceux qu'on laisse derrière", "Le prix", "Un absent", "Murano", "La nuit des décharges", "La dette", "La place vide", "Crédits"];
    const files = ["cover.png", ...Array.from({length: 12}, (_, index) => `page-${String(index + 1).padStart(2, "0")}.png`), "back.png"];
    const image = document.getElementById("page");
    const nav = document.getElementById("chapters");
    const buttons = titles.map((title, index) => {
      const button = document.createElement("button");
      button.type = "button";
      button.innerHTML = `<span>${String(index + 1).padStart(2, "0")}</span>${title}`;
      button.addEventListener("click", () => go(index + 1));
      nav.append(button);
      return button;
    });
    let current = 1;
    function go(number, updateHash = true) {
      current = Math.max(1, Math.min(14, number));
      image.src = `pages/${files[current - 1]}`;
      image.alt = `${titles[current - 1]} du comics HOLT`;
      document.getElementById("chapter").textContent = titles[current - 1];
      document.getElementById("description").textContent = `Page ${current} sur 14`;
      document.getElementById("counter").textContent = `${String(current).padStart(2, "0")} / 14`;
      document.getElementById("previous").disabled = current === 1;
      document.getElementById("next").disabled = current === 14;
      buttons.forEach((button, index) => { if (index + 1 === current) button.setAttribute("aria-current", "page"); else button.removeAttribute("aria-current"); });
      if (updateHash) history.replaceState(null, "", `#page-${current}`);
      const preload = new Image();
      preload.src = `pages/${files[Math.min(13, current)]}`;
    }
    document.getElementById("previous").addEventListener("click", () => go(current - 1));
    document.getElementById("next").addEventListener("click", () => go(current + 1));
    document.addEventListener("keydown", event => {
      if (event.key === "ArrowLeft") { event.preventDefault(); go(current - 1); }
      if (event.key === "ArrowRight") { event.preventDefault(); go(current + 1); }
      if (event.key === "Home") { event.preventDefault(); go(1); }
      if (event.key === "End") { event.preventDefault(); go(14); }
    });
    window.addEventListener("hashchange", () => go(Number(location.hash.match(/^#page-(\d+)$/)?.[1]) || 1, false));
    go(Number(location.hash.match(/^#page-(\d+)$/)?.[1]) || 1, false);
  </script>
</body>
</html>
